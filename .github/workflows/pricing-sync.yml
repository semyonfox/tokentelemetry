name: Pricing sync
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Generate rates for review
        working-directory: engine
        run: go run ./cmd/pricing-sync
      - uses: actions/upload-artifact@v4
        with:
          name: pricing
          path: engine/internal/pricing/data/pricing.json
